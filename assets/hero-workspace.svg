<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Espaço de trabalho de uma desenvolvedora</title><desc id="desc">Uma mesa aconchegante com computador exibindo código, livros, planta, gato dormindo e detalhes de fantasia.</desc>
<defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#38213c"/><stop offset="1" stop-color="#211328"/></linearGradient>
 <linearGradient id="desk" x2="0" y2="1"><stop stop-color="#8a536e"/><stop offset="1" stop-color="#3c233d"/></linearGradient>
 <linearGradient id="screen" x2="1" y2="1"><stop stop-color="#251d3b"/><stop offset="1" stop-color="#121923"/></linearGradient>
 <linearGradient id="glow" x2="0" y2="1"><stop stop-color="#f2b974" stop-opacity=".62"/><stop offset="1" stop-color="#f2b974" stop-opacity="0"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#ca7ebe" stop-opacity=".35"/><stop offset="1" stop-color="#ca7ebe" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
 <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
